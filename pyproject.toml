[project]
name = "autonomous-research-agent"
version = "1.0.0"
description = "5-agent AI research system with LangGraph reflection loops"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "duckduckgo-search>=6.3.0",
    "streamlit>=1.38.0",
    "requests>=2.31.0",
    "ddgs>=9.14.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
start = "run:main"
